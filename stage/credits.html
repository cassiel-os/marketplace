<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/sdk/ludei.js"></script>
  <style>
    html, body { min-height: 100%; margin: 0; }
    body { overflow: auto; }
    #credits { padding: 8px; }
  </style>
</head>
<body>
  <main id="credits"></main>
  <script>
    ludei.ready.then(({ props }) => {
      const source = new DOMParser().parseFromString(String(props?.html || ''), 'text/html');
      const title = source.title || 'EaglercraftX 1.8 Credits';
      ludei.setTitle(title);
      for (const style of source.head.querySelectorAll('style, link[rel="stylesheet"]')) {
        document.head.append(style.cloneNode(true));
      }
      document.querySelector('#credits').innerHTML = source.body.innerHTML;
    });
  </script>
</body>
</html>
