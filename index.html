<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify</title>
    <link rel="stylesheet" href="/sdk/cassiel.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form class="bar" id="bar">
      <input id="link" type="text" placeholder="Paste a Spotify link" autocomplete="off" spellcheck="false" />
      <button type="submit">Open</button>
    </form>
    <main class="player">
      <div class="embed" id="embed"></div>
      <p class="loading" id="loading">Loading Spotify…</p>
    </main>
    <div class="controls">
      <button id="play" disabled>Play</button>
      <button id="pause" disabled>Pause</button>
      <span class="state" id="state"></span>
    </div>
    <footer class="status">Unofficial. Not made by or affiliated with Spotify.</footer>
    <script src="/sdk/cassiel.js"></script>
    <script src="app.js"></script>
  </body>
</html>
