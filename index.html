<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>M.U.G.E.N</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/sdk/cassiel.css" />
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #000; color: #ccc; }
      body { display: grid; place-items: center; }
      canvas { display: block; outline: none; image-rendering: pixelated; width: 100vw; height: 100vh; object-fit: contain; }
      canvas.stretch { object-fit: fill; }
      :fullscreen canvas { object-fit: contain; }
      canvas[hidden] { display: none; }
      #setup { max-width: 34em; padding: 16px; line-height: 1.5; }
      #setup[hidden] { display: none; }
      #setup code { user-select: all; }
    </style>
  </head>
  <body>
    <canvas id="screen" tabindex="0" hidden></canvas>
    <div id="setup" hidden>
      <h2 id="setup-title"></h2>
      <p id="setup-text"></p>
      <p><code id="setup-path"></code></p>
      <p><button id="setup-retry"></button></p>
    </div>
    <script src="/sdk/cassiel.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
