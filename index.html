<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Winamp for Spotify</title>
    <link rel="stylesheet" href="/sdk/cassiel.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="skin.css" />
  </head>
  <body>
    <!-- Webamp (Winamp 2, its base skin made sharp: skin.css) on the left. -->
    <div class="deck"><div class="stage" id="stage"></div></div>

    <!-- The Media Library: Spotify, as Winamp's library shows a collection. Its title
         bar is the window's. -->
    <section class="wa ml" id="ml">
      <header class="title" data-window-drag>
        <span class="t-name">WINAMP LIBRARY</span>
        <button class="t-btn min" data-window-action="minimize" aria-label="Minimize" data-tooltip="Minimize"></button>
        <button class="t-btn shade" data-window-action="maximize" aria-label="Maximize" data-tooltip="Maximize"></button>
        <button class="t-btn close" data-window-action="close" aria-label="Close" data-tooltip="Close"></button>
      </header>
      <div class="ml-body">
        <div class="ml-side">
          <ul class="tree" id="tree" tabindex="0"></ul>
          <button class="ml-btn" id="sign">Sign in</button>
        </div>
        <div class="ml-main">
          <form class="ml-search" id="search">
            <label for="query">Search:</label>
            <input id="query" type="search" autocomplete="off" />
            <button type="button" class="ml-btn" id="clearSearch">Clear Search</button>
          </form>
          <div class="grid">
            <div class="grid-head"><span>Artist</span><span>Album</span><span>Track #</span><span>Title</span><span>Length</span></div>
            <ul class="grid-rows" id="results" tabindex="0"></ul>
          </div>
          <div class="ml-foot">
            <button class="ml-btn" id="mlPlay">Play</button><button class="ml-btn" id="mlEnqueue" data-tooltip="Add to the playlist">Enqueue</button>
            <span class="ml-status" id="status"></span>
          </div>
        </div>
      </div>
    </section>
    <script src="/sdk/cassiel.js"></script>
    <script src="webamp.js"></script>
    <script src="auth.js"></script>
    <script src="spotify.js"></script>
    <script src="app.js"></script>
  </body>
</html>
