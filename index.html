<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neo Arcade</title>
    <link rel="stylesheet" href="/sdk/cassiel.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NeoRAGEx's look: its own title bar (three lights), its menu bar with the ROM
         and BIOS count, the ROM browser with thumbnails, the screen and a status line. -->
    <header class="bar" data-window-drag>
      <span class="lights">
        <button class="light close" data-window-action="close" aria-label="Cerrar" data-tooltip="Cerrar"></button>
        <button class="light min" data-window-action="minimize" aria-label="Minimizar" data-tooltip="Minimizar"></button>
        <button class="light max" data-window-action="maximize" aria-label="Maximizar" data-tooltip="Maximizar"></button>
      </span>
      <span class="title">Neo Arcade</span>
    </header>
    <nav class="toolbar" id="menubar" role="menubar"></nav>
    <div class="body">
      <aside class="list">
        <div class="lh">Biblioteca · <span id="count">0</span></div>
        <ul class="games" id="games" tabindex="0" role="listbox" aria-label="Juegos"></ul>
        <button class="folder" id="folder" data-tooltip="Vuelve a leer Programs/Neo Arcade/roms (F5)">Volver a leer las ROMs</button>
      </aside>
      <main class="main">
        <div class="screen" id="screen">
          <img class="snap" id="snap" alt="" hidden />
          <div class="empty" id="empty"></div>
          <canvas id="canvas" hidden></canvas>
        </div>
        <footer class="status">
          <span class="now" id="now"></span>
          <span class="state" id="state"></span>
        </footer>
      </main>
    </div>
    <ul class="dropdown" id="dropdown" role="menu" hidden></ul>
    <script src="/sdk/cassiel.js"></script>
    <script src="nostalgist.js"></script>
    <script src="games.js"></script>
    <script src="app.js"></script>
  </body>
</html>
